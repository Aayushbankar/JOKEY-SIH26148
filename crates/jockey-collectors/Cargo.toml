[package]
name = "jockey-collectors"
version = "0.1.0"
edition = "2021"
description = "JOCKY Collectors: Collector trait, Windows/Linux implementations"
license = "MIT"
repository = "https://github.com/RishiSakhija/JOKEY---SIH26148"
categories = ["forensics", "security", "system-tools"]
keywords = ["forensics", "dfir", "collector", "windows", "linux", "artifact"]

[dependencies]
# Workspace dependencies
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
chrono = { workspace = true }
blake3 = { workspace = true }
async-trait = "0.1"
sha2 = { workspace = true }
hex = { workspace = true }
walkdir = "2"
libc = "0.2"

# Crate-local dependencies
jockey-core = { path = "../jockey-core" }
jockey-evidence = { path = "../jockey-evidence" }

# Platform-specific (optional, enabled via features)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_WindowsProgramming",
    "Win32_Security",
    "Win32_NetworkManagement_Ndis",
] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = "0.28"

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }