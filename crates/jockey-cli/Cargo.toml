[package]
name = "jockey-cli"
version = "0.1.0"
edition = "2021"
description = "JOCKY CLI — Command-line interface for JOCKY"
license = "MIT"
repository = "https://github.com/RishiSakhija/JOKEY---SIH26148"
categories = ["forensics", "security", "command-line-utilities"]
keywords = ["forensics", "dfir", "cli"]

[[bin]]
name = "jockey"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true, features = ["derive", "env", "wrap_help"] }
hostname = "0.3"
ulid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }

# Crate-local dependencies
jockey-language = { path = "../jockey-language" }
jockey-core = { path = "../jockey-core" }
jockey-runtime = { path = "../jockey-runtime" }
jockey-collectors = { path = "../jockey-collectors" }
jockey-evidence = { path = "../jockey-evidence" }
jockey-correlation = { path = "../jockey-correlation" }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }