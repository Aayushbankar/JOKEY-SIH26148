[workspace]
resolver = "2"
members = [
    "crates/jockey-core",
    "crates/jockey-language",
    "crates/jockey-runtime",
    "crates/jockey-evidence",
    "crates/jockey-collectors",
    "crates/jockey-correlation",
    "crates/jockey-api",
    "crates/jockey-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/RishiSakhija/JOKEY---SIH26148"
description = "JOCKY — Evidence-Contract Forensics Platform"

[workspace.dependencies]
# Core
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Parsing
pest = { version = "2.7" }
pest_derive = "2.7"

# Cryptography
blake3 = "1.5"
ed25519-dalek = "2.1"
rand = "0.8"
zeroize = "1.7"
sha2 = "0.10"
hex = "0.4"

# IDs & Time
ulid = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde", "fast-rng"] }

# Graph
petgraph = { version = "0.6", features = ["serde", "graphmap"] }

# Database
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid", "serde_json"] }

# Web
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
http = "1.0"
mime = "0.3"

# Config
figment = { version = "0.10" }
config = { version = "0.13" }

# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }

# Testing
proptest = "1.0"
tempfile = "3.8"

[workspace.lints]
rust.all = "warn"
rust.unused_crate_dependencies = "allow"
rust.unused_imports = "warn"
rust.unused_variables = "warn"
clippy.all = "warn"
clippy.cargo = "allow"
clippy.pedantic = "warn"
clippy.nursery = "warn"
clippy.restriction = "allow"

[profile.dev]
debug = true
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true